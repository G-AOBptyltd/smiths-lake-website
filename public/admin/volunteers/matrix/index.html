<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Volunteer groups grid · VillageFirst</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="/admin/admin-nav.js" defer></script>
<style>
  :root { --ink:#1f2a24; --muted:#6b746d; --line:#e2e7e2; --bg:#f5f7f4; --accent:#2f8f5b; --err:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .auth-screen { max-width:460px; margin:12vh auto; text-align:center; padding:24px; }
  .auth-screen h1 { font-family:Georgia,serif; }
  .btn { border:none; border-radius:10px; padding:11px 18px; font:600 15px inherit; cursor:pointer; background:var(--accent); color:#fff; }
  .topbar { background: linear-gradient(135deg, #0f4c3a 0%, #15795f 60%, #0f8f80 100%); display:flex; align-items:center; padding:0 16px; height:46px; gap:10px; }
  .topbar-brand { color:#fff; font-weight:800; font-size:13px; white-space:nowrap; }
  .topbar-brand a { color:rgba(255,255,255,.7); text-decoration:none; }
  .topbar-sp { flex:1; }
  .topbar-user { font-size:11px; color:rgba(255,255,255,.6); }
  .topbar-logout { background:none; border:1px solid rgba(255,255,255,.25); color:rgba(255,255,255,.7); font-size:11px; padding:3px 10px; border-radius:5px; cursor:pointer; }
  .village-select { font-size:11px; color:#c7eedd; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.3); border-radius:5px; padding:3px 8px; font-family:inherit; }
  .village-select option { color:#1f2937; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 64px; }
  h1.page { font-family:Georgia,serif; font-size:24px; margin:8px 0 2px; }
  .lead { color:var(--muted); margin:0 0 6px; }
  .warn { color:#8a5a00; background:#fff8e6; border:1px solid #f0d69a; border-radius:8px; padding:8px 12px; font-size:13px; margin:10px 0 16px; display:inline-block; }
  .notice { background:#fff8e6; border:1px solid #f0d69a; border-radius:12px; padding:14px 16px; color:#5a4300; }
  .grid-wrap { overflow:auto; border:1px solid var(--line); border-radius:12px; background:#fff; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap; }
  thead th { position:sticky; top:0; background:#f0f4f1; font-size:12px; color:#374151; z-index:2; }
  th.name, td.name { text-align:left; position:sticky; left:0; background:#fff; z-index:1; }
  thead th.name { z-index:3; background:#f0f4f1; }
  td.name .em { color:var(--muted); font-size:12px; }
  tbody tr:nth-child(even) td { background:#fbfcfb; }
  tbody tr:nth-child(even) td.name { background:#fbfcfb; }
  input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); cursor:pointer; }
  input[type=checkbox]:disabled { opacity:.5; }
  .flash { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#12603a; color:#fff; padding:8px 16px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .flash.on { opacity:1; }
  .empty { color:var(--muted); padding:20px; }
</style>
</head>
<body>

<div id="auth-screen" class="auth-screen">
  <div style="font-size:3rem;">🗂️</div>
  <h1>Volunteer groups</h1>
  <p>Sign in to manage who's in which group.</p>
  <button class="btn" onclick="netlifyIdentity.open('login')">Sign in</button>
</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="topbar-brand"><a href="/admin/volunteers/">🏘️ Volunteers</a> · Groups grid</div>
    <select id="village-select" class="village-select" aria-label="Village"><option>Smiths Lake</option></select>
    <div class="topbar-sp"></div>
    <span class="topbar-user" id="user-email"></span>
    <button class="topbar-logout" onclick="netlifyIdentity.logout()">Sign out</button>
  </div>
  <div class="wrap">
    <h1 class="page">Volunteer groups</h1>
    <p class="lead">Tick to add a volunteer to a group, untick to remove them.</p>
    <div class="warn">⚠︎ Every tick / untick emails the volunteer a friendly heads-up. Only change what you mean to.</div>
    <div id="notice" class="notice" style="display:none;"></div>
    <div id="grid" class="grid-wrap"><div class="empty">Loading…</div></div>
  </div>
</div>
<div id="flash" class="flash"></div>

<script>
  let VILLAGE = localStorage.getItem('vf_active_village') || 'Smiths Lake';
  let currentUser = null;

  netlifyIdentity.on('init', u => { if (u) { currentUser = u; boot(); } });
  netlifyIdentity.on('login', u => { currentUser = u; netlifyIdentity.close(); boot(); });
  netlifyIdentity.on('logout', () => { currentUser = null; location.reload(); });

  async function authHeaders() {
    let token = null;
    try { const u = netlifyIdentity.currentUser(); if (u) token = await u.jwt(); } catch (_) {}
    return { 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) };
  }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  function boot() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-email').textContent = (currentUser && currentUser.email) || '';
    load();
  }

  let flashTimer = null;
  function flash(msg) {
    const f = document.getElementById('flash');
    f.textContent = msg; f.classList.add('on');
    clearTimeout(flashTimer); flashTimer = setTimeout(() => f.classList.remove('on'), 1800);
  }
  function showNotice(msg) {
    const n = document.getElementById('notice'); n.style.display = ''; n.textContent = msg;
    document.getElementById('grid').innerHTML = '';
  }

  async function load() {
    try {
      const r = await fetch('/api/vapp-matrix?village=' + encodeURIComponent(VILLAGE), { headers: await authHeaders() });
      if (r.status === 401 || r.status === 403) { showNotice('The groups grid is admin-only.'); return; }
      const d = await r.json();
      if (d.configured === false) { showNotice('The volunteer app isn’t connected yet.'); return; }
      render(d.volunteers || [], d.groups || []);
    } catch (_) { showNotice('Could not load — please try again.'); }
  }

  function render(volunteers, groups) {
    const grid = document.getElementById('grid');
    if (!groups.length) { grid.innerHTML = '<div class="empty">No groups yet. Groups appear here once volunteers are in them (via sign-ups, the app, or converting a lead).</div>'; return; }
    if (!volunteers.length) { grid.innerHTML = '<div class="empty">No active volunteers yet.</div>'; return; }
    let head = '<thead><tr><th class="name">Volunteer (' + volunteers.length + ')</th>';
    groups.forEach(g => { head += '<th>' + esc(g.title) + '</th>'; });
    head += '</tr></thead>';
    let bodyRows = volunteers.map(v => {
      const set = new Set(v.groups || []);
      let row = '<tr><td class="name"><div>' + esc(v.name) + '</div><div class="em">' + esc(v.email) + '</div></td>';
      groups.forEach(g => {
        const checked = set.has(g.slug) ? ' checked' : '';
        row += '<td><input type="checkbox"' + checked +
          ' onchange="toggle(this, \'' + v.id + '\', \'' + g.slug + '\', ' + JSON.stringify(g.title).replace(/"/g, '&quot;') + ')"></td>';
      });
      return row + '</tr>';
    }).join('');
    grid.innerHTML = '<table>' + head + '<tbody>' + bodyRows + '</tbody></table>';
  }

  async function toggle(cb, volunteerId, groupSlug, groupTitle) {
    const on = cb.checked;
    cb.disabled = true;
    try {
      const r = await fetch('/api/vapp-matrix', { method: 'POST', headers: await authHeaders(),
        body: JSON.stringify({ village: VILLAGE, volunteerId, groupSlug, groupTitle, on }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Could not save');
      flash(on ? 'Added to ' + groupTitle + ' · emailed' : 'Removed from ' + groupTitle + ' · emailed');
    } catch (e) { cb.checked = !on; alert(e.message); }
    finally { cb.disabled = false; }
  }
</script>
</body>
</html>
