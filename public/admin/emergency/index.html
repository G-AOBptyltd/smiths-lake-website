<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Emergency & Safety · VillageFirst</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="/admin/admin-nav.js" defer></script>
<style>
  :root { --ink:#1f2a24; --muted:#6b746d; --line:#e2e7e2; --bg:#f5f7f4; --accent:#b3261e; --green:#2f8f5b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .auth-screen { max-width:460px; margin:12vh auto; text-align:center; padding:24px; }
  .auth-screen h1 { font-family:Georgia,serif; }
  .btn { border:none; border-radius:10px; padding:10px 16px; font:600 14px inherit; cursor:pointer; background:var(--green); color:#fff; }
  .btn.ghost { background:#fff; color:var(--green); border:1.5px solid var(--green); }
  .btn:disabled { opacity:.55; cursor:default; }
  .topbar { background: linear-gradient(135deg, #7a1a12 0%, #b3261e 60%, #d1493f 100%); display:flex; align-items:center; padding:0 16px; height:46px; gap:10px; }
  .topbar-brand { color:#fff; font-weight:800; font-size:13px; white-space:nowrap; }
  .topbar-brand a { color:rgba(255,255,255,.75); text-decoration:none; }
  .topbar-sp { flex:1; }
  .topbar-user { font-size:11px; color:rgba(255,255,255,.7); }
  .topbar-logout { background:none; border:1px solid rgba(255,255,255,.3); color:rgba(255,255,255,.8); font-size:11px; padding:3px 10px; border-radius:5px; cursor:pointer; }
  .village-select { font-size:11px; color:#fde2df; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.35); border-radius:5px; padding:3px 8px; font-family:inherit; }
  .village-select option { color:#1f2937; }
  .wrap { max-width:860px; margin:0 auto; padding:20px 16px 64px; }
  h1.page { font-family:Georgia,serif; font-size:24px; margin:8px 0 2px; }
  .lead { color:var(--muted); margin:0 0 14px; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .msg { font-size:13px; color:var(--muted); } .msg.err { color:var(--accent); }
  .notice { background:#fff8e6; border:1px solid #f0d69a; border-radius:12px; padding:14px 16px; color:#5a4300; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin:14px 0; }
  .card h2 { font-size:17px; margin:0 0 2px; }
  .card .sub { color:var(--muted); font-size:12.5px; margin:0 0 10px; }
  label { display:block; font-size:12.5px; font-weight:600; color:#374151; margin:10px 0 3px; }
  input, textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px; font:inherit; background:#fff; }
  textarea { min-height:64px; resize:vertical; }
  .two { display:flex; gap:12px; flex-wrap:wrap; } .two > div { flex:1; min-width:180px; }
  .chk { display:flex; align-items:center; gap:8px; font-weight:500; margin-top:10px; cursor:pointer; }
  .chk input { width:auto; accent-color:var(--green); }
  .card-actions { display:flex; gap:10px; align-items:center; margin-top:12px; }
  .empty { color:var(--muted); padding:20px; }
</style>
</head>
<body>

<div id="auth-screen" class="auth-screen">
  <div style="font-size:3rem;">🚨</div>
  <h1>Emergency &amp; Safety</h1>
  <p>Sign in to manage the emergency &amp; safety information.</p>
  <button class="btn" onclick="netlifyIdentity.open('login')">Sign in</button>
</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="topbar-brand"><a href="/admin/">🏘️ Admin</a> · Emergency</div>
    <select id="village-select" class="village-select" aria-label="Village"><option>Smiths Lake</option></select>
    <div class="topbar-sp"></div>
    <span class="topbar-user" id="user-email"></span>
    <button class="topbar-logout" onclick="netlifyIdentity.logout()">Sign out</button>
  </div>
  <div class="wrap">
    <h1 class="page">Emergency &amp; Safety</h1>
    <p class="lead">Keep each emergency card's contacts, hours and response info up to date. Saving updates the record; <b>Publish to website</b> pushes it live (~3 min).</p>
    <div class="toolbar">
      <button class="btn ghost" onclick="publish()">Publish to website</button>
      <span class="msg" id="pub-msg"></span>
    </div>
    <div id="notice" class="notice" style="display:none;"></div>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>
</div>

<script>
  let VILLAGE = localStorage.getItem('vf_active_village') || 'Smiths Lake';
  let currentUser = null, cards = [];

  netlifyIdentity.on('init', u => { if (u) { currentUser = u; boot(); } });
  netlifyIdentity.on('login', u => { currentUser = u; netlifyIdentity.close(); boot(); });
  netlifyIdentity.on('logout', () => { currentUser = null; location.reload(); });

  async function authHeaders() {
    let token = null;
    try { const u = netlifyIdentity.currentUser(); if (u) token = await u.jwt(); } catch (_) {}
    return { 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) };
  }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  function boot() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-email').textContent = (currentUser && currentUser.email) || '';
    load();
  }
  function showNotice(msg) {
    const n = document.getElementById('notice'); n.style.display = ''; n.textContent = msg;
    document.getElementById('list').innerHTML = '';
  }

  async function load() {
    try {
      const r = await fetch('/api/emergency-list?village=' + encodeURIComponent(VILLAGE), { headers: await authHeaders() });
      if (r.status === 401 || r.status === 403) { showNotice('You need the Emergency Coordinator (or admin) role to manage this.'); return; }
      const d = await r.json();
      if (!r.ok) { showNotice(d.error || 'Could not load.'); return; }
      cards = d.cards || [];
      render();
    } catch (_) { showNotice('Could not load — please try again.'); }
  }

  function field(id, label, val, type) {
    return '<label>' + esc(label) + '</label><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(val) + '">';
  }
  function render() {
    const el = document.getElementById('list');
    if (!cards.length) { el.innerHTML = '<div class="empty">No Emergency &amp; Safety cards found for this village.</div>'; return; }
    el.innerHTML = cards.map((c, i) =>
      '<div class="card" id="card-' + i + '">' +
        '<h2>' + esc(c.title) + '</h2><div class="sub">' + esc(c.path) + (c.statusOnWeb ? ' · ' + esc(c.statusOnWeb) : '') + '</div>' +
        '<label>Response info — what residents should know / do</label><textarea id="ri-' + i + '">' + esc(c.responseInfo) + '</textarea>' +
        '<label>Description</label><textarea id="de-' + i + '">' + esc(c.description) + '</textarea>' +
        '<div class="two"><div>' + field('cp-' + i, 'Contact person', c.contactPerson) + '</div>' +
          '<div>' + field('ph-' + i, 'Contact phone', c.contactPhone, 'tel') + '</div></div>' +
        '<div class="two"><div>' + field('em-' + i, 'Contact email', c.contactEmail, 'email') + '</div>' +
          '<div>' + field('hr-' + i, 'Operating hours', c.operatingHours) + '</div></div>' +
        field('ad-' + i, 'Address', c.address) +
        field('we-' + i, 'Website', c.websiteUrl, 'url') +
        '<label class="chk"><input type="checkbox" id="sc-' + i + '"' + (c.showContactPublicly !== 'FALSE' ? ' checked' : '') + '> Show contact details publicly on the website</label>' +
        '<div class="card-actions"><button class="btn" onclick="saveCard(' + i + ')">Save</button><span class="msg" id="cm-' + i + '"></span></div>' +
      '</div>'
    ).join('');
  }

  async function saveCard(i) {
    const c = cards[i]; const v = id => (document.getElementById(id + '-' + i) || {}).value || '';
    const msg = document.getElementById('cm-' + i); msg.className = 'msg'; msg.textContent = 'Saving…';
    try {
      const r = await fetch('/api/emergency-update', { method: 'POST', headers: await authHeaders(), body: JSON.stringify({
        village: VILLAGE, pageId: c.id,
        responseInfo: v('ri'), description: v('de'), contactPerson: v('cp'), contactPhone: v('ph'),
        contactEmail: v('em'), operatingHours: v('hr'), address: v('ad'), websiteUrl: v('we'),
        showContactPublicly: document.getElementById('sc-' + i).checked,
      }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Save failed');
      msg.textContent = 'Saved ✓ — Publish to push it live.';
    } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
  }

  async function publish() {
    const msg = document.getElementById('pub-msg'); msg.className = 'msg'; msg.textContent = 'Publishing…';
    try {
      const r = await fetch('/api/news-publish', { method: 'POST', headers: await authHeaders(), body: JSON.stringify({ village: VILLAGE }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Publish failed');
      msg.textContent = 'Publishing — the website updates in ~3 minutes.';
    } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
  }
</script>
</body>
</html>
