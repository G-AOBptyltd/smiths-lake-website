<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Results — VillageFirst</title>
  <meta name="robots" content="noindex">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/css/vf-results.css">
  <script src="/js/results-engine.js"></script>
  <style>
    /* page chrome only — the results components live in vf-results.css */
    :root{
      --primary:#0f4c3a;--primary-2:#15795f;--accent:#0f8f80;
      --grad:linear-gradient(135deg,#0f4c3a 0%,#15795f 60%,#0f8f80 100%);
      --ink:#16261f;--muted:#6b7c75;--line:#e3ece8;--bg:#eef4f1;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}

    .vf-topnav{background:#0c2c22;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .vf-topnav a,.vf-topnav button.lnk{color:rgba(255,255,255,.8);text-decoration:none;font-size:12px;background:none;border:0;cursor:pointer;font:inherit}
    .vf-topnav a:hover,.vf-topnav button.lnk:hover{color:#fff}
    .vf-topnav .sep{color:rgba(255,255,255,.3)}
    .vf-topnav .right{margin-left:auto;display:flex;gap:12px;align-items:center}

    .hero{background:var(--grad);color:#fff;padding:28px 0 24px;position:relative;overflow:hidden}
    .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%)}
    .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
    .crumb{display:flex;align-items:center;gap:7px;font-size:11.5px;opacity:.9;margin-bottom:6px;flex-wrap:wrap}
    .crumb a{color:#fff;text-decoration:none;opacity:.85}.crumb a:hover{opacity:1;text-decoration:underline}
    .crumb .cs{opacity:.5}
    .hero .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.78;font-weight:700}
    .hero h1{font-size:25px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
    .hero .sub{opacity:.85;font-size:13px;margin-top:5px}
    .badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:30px;padding:5px 14px;font-size:12px;margin-top:13px}
    .live-dot{width:8px;height:8px;border-radius:50%;background:#bdf5d8;animation:pulse 1.8s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(189,245,216,.7)}70%{box-shadow:0 0 0 9px rgba(189,245,216,0)}100%{box-shadow:0 0 0 0 rgba(189,245,216,0)}}

    .subnav{background:#fff;border-bottom:1px solid var(--line)}
    .subnav-inner{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
    .subnav a.back{color:var(--primary-2);font-weight:700;font-size:13px;text-decoration:none}.subnav a.back:hover{text-decoration:underline}
    .subnav .right{margin-left:auto;display:flex;align-items:center;gap:8px}
    .subnav select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:260px;background:#fff;color:var(--ink)}
    .navbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;font-weight:600;color:var(--primary-2);cursor:pointer}
    .navbtn:hover:not(:disabled){background:var(--tint1,#ecfdf5)}.navbtn:disabled{opacity:.35;cursor:default}

    main{max-width:1040px;margin:0 auto;padding:22px 20px 70px}

    @media print{.vf-topnav,.subnav,.no-print{display:none!important}body{background:#fff}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style>
</head>
<body>

<nav class="vf-topnav">
  <a href="/projects/">← Back to Project Hub</a>
  <span class="sep">·</span>
  <a id="navAllResults" href="/results/">📊 All Results</a>
  <span class="sep">·</span>
  <a id="survey-link" href="/survey/">Complete Survey</a>
  <span class="sep">·</span>
  <a href="/">VillageFirst Website</a>
  <div class="right">
    <button class="lnk" id="greyToggle">◐ Greyscale</button>
    <span class="sep">·</span>
    <button class="lnk" onclick="window.print();return false;">🖨 Print / Save PDF</button>
  </div>
</nav>

<header class="hero"><div class="wrap">
  <div class="crumb" id="hCrumb" style="display:none"></div>
  <div class="eyebrow" id="hEye">VillageFirst Community Survey</div>
  <h1 id="hTitle">Loading…</h1>
  <div class="sub" id="hSub"></div>
  <span class="badge" id="hBadgeWrap" style="display:none"><span class="live-dot" id="hDot"></span><span id="hBadge"></span></span>
</div></header>

<div class="subnav" id="subnav" style="display:none"><div class="wrap subnav-inner">
  <a class="back" id="allResults" href="#">← All results</a>
  <div class="right">
    <button class="navbtn" id="prevSurvey" title="Previous survey">‹</button>
    <select id="surveySwitch" aria-label="Jump to another survey"></select>
    <button class="navbtn" id="nextSurvey" title="Next survey">›</button>
  </div>
</div></div>

<main><div id="main" class="vfr-root"></div></main>

<script>
(function(){
  const API='/api';
  const root=document.documentElement;
  let curTheme=VFResults.themeForVillage('');
  const $=id=>document.getElementById(id);
  function applyTheme(t){curTheme=t;VFResults.setTheme(root,t)}
  applyTheme(curTheme);

  function showState(icon,msg,link){$('main').querySelector('#main').className='vfr-root';$('subnav').style.display='none';$('hCrumb').style.display='none';document.getElementById('main').innerHTML=`<div class="vf-state"><h2>${icon} ${VFResults.util.esc(msg)}</h2>${link?'<a href="/" class="vf-btn">Return to website</a>':''}</div>`}

  /* ---- single-survey navigation ---- */
  async function fetchVillageSurveys(village){try{const r=await fetch(`${API}/survey-list?village=${encodeURIComponent(village||'Smiths Lake')}`);const d=await r.json();return (d.surveys||[]).filter(s=>s.slug)}catch(e){return[]}}
  function buildSurveyNav(survey,slug){
    const village=survey.village||'Smiths Lake';
    const cr=$('hCrumb');
    let html=`<a href="/results/?village=${encodeURIComponent(village)}">${VFResults.util.esc(village)}</a><span class="cs">›</span>`;
    if(survey.projectName){const projHref=survey.projectNotionId?`/results/?project=${encodeURIComponent(survey.projectNotionId)}&village=${encodeURIComponent(village)}`:'/projects/';html+=`<a href="${projHref}">${VFResults.util.esc(survey.projectName)}</a><span class="cs">›</span>`;}
    html+=`<span>${VFResults.util.esc(survey.surveyName||'Survey')}</span>`;
    cr.innerHTML=html;cr.style.display='';
    $('subnav').style.display='';
    $('allResults').href=`/results/?village=${encodeURIComponent(village)}`;
    $('navAllResults').href=`/results/?village=${encodeURIComponent(village)}`;
    fetchVillageSurveys(village).then(list=>{
      const items=list.filter(VFResults.util.publicViewable);
      const sel=$('surveySwitch');sel.innerHTML='';
      items.forEach(s=>{const o=document.createElement('option');o.value=s.slug;o.textContent=s.surveyName;if(s.slug===slug)o.selected=true;sel.appendChild(o)});
      if(!items.some(s=>s.slug===slug)){const o=document.createElement('option');o.value=slug;o.textContent=survey.surveyName||slug;o.selected=true;sel.insertBefore(o,sel.firstChild)}
      sel.onchange=()=>{location.href=`/results/?slug=${encodeURIComponent(sel.value)}`};
      const idx=items.findIndex(s=>s.slug===slug);
      const prev=$('prevSurvey'),next=$('nextSurvey');
      const pv=idx>0?items[idx-1]:null,nx=(idx>-1&&idx<items.length-1)?items[idx+1]:null;
      prev.disabled=!pv;next.disabled=!nx;
      if(pv)prev.onclick=()=>location.href=`/results/?slug=${encodeURIComponent(pv.slug)}`;
      if(nx)next.onclick=()=>location.href=`/results/?slug=${encodeURIComponent(nx.slug)}`;
    });
  }

  /* ---- hub (no slug) ---- */
  async function renderHub(village){
    $('survey-link').href='/survey/';
    $('navAllResults').href=`/results/?village=${encodeURIComponent(village)}`;
    applyTheme(VFResults.themeForVillage(village));
    $('hEye').textContent=village+' · VillageFirst Community Surveys';
    $('hTitle').textContent='Community Survey Results';
    $('hSub').textContent='Browse results from across the village';
    $('subnav').style.display='none';$('hCrumb').style.display='none';
    document.getElementById('main').innerHTML='<div class="vf-state"><div class="vf-spinner"></div><p>Loading surveys…</p></div>';
    const surveys=await fetchVillageSurveys(village);
    // Live response counts (health endpoint = counts only, no content).
    const visible=surveys.filter(s=>s.slug).filter(VFResults.util.publicViewable);
    await Promise.all(visible.map(async s=>{try{const r=await fetch(`${API}/survey-health?slug=${encodeURIComponent(s.slug)}`);const h=await r.json();if(h&&h.responseCount!=null)s.responseCount=h.responseCount}catch(_){}}));
    VFResults.renderHub(document.getElementById('main'),surveys,{village,theme:curTheme});
  }

  /* ---- project bundle (?project=<projectNotionId>) ---- */
  async function renderProject(projectId,village){
    $('survey-link').href='/survey/';
    $('navAllResults').href=`/results/?village=${encodeURIComponent(village)}`;
    applyTheme(VFResults.themeForVillage(village));
    $('subnav').style.display='none';$('hCrumb').style.display='none';$('hBadgeWrap').style.display='none';
    document.getElementById('main').innerHTML='<div class="vf-state"><div class="vf-spinner"></div><p>Loading project…</p></div>';
    const all=await fetchVillageSurveys(village);
    const matching=all.filter(s=>s.projectNotionId===projectId);
    const projectName=(matching.find(s=>s.projectName)||{}).projectName||'Project Results';
    $('hEye').textContent=village;
    $('hTitle').textContent=projectName;
    $('hSub').textContent=`All surveys linked to this project · ${matching.length} survey${matching.length===1?'':'s'}`;
    if(!matching.length){VFResults.renderHub(document.getElementById('main'),[],{village,theme:curTheme});return}
    // Live response counts (health endpoint = counts only, no content).
    const visible=matching.filter(s=>s.slug).filter(VFResults.util.publicViewable);
    await Promise.all(visible.map(async s=>{try{const r=await fetch(`${API}/survey-health?slug=${encodeURIComponent(s.slug)}`);const h=await r.json();if(h&&h.responseCount!=null)s.responseCount=h.responseCount}catch(_){}}));
    VFResults.renderHub(document.getElementById('main'),matching,{village,theme:curTheme});
  }

  /* ---- single survey ---- */
  function renderSurvey(survey,data,status){
    const isLive=status==='active';const count=data.count||0;
    const snapDate=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
    $('hEye').textContent=(survey&&survey.village?survey.village+' · ':'')+'VillageFirst Community Survey';
    $('hTitle').textContent=(survey&&survey.surveyName)||'Community Survey Results';
    $('hSub').textContent=(survey&&survey.snapshotLabel)||'';
    $('hBadgeWrap').style.display='';$('hDot').style.display=isLive?'':'none';
    $('hBadge').innerHTML=`${isLive?'Live':'📸 Snapshot'} · ${snapDate} · n = ${count} responses${isLive?' · still open':''}`;
    VFResults.render(document.getElementById('main'),data,status,{theme:curTheme});
  }

  $('greyToggle').addEventListener('click',function(){
    if(root.dataset.grey==='1'){root.dataset.grey='';applyTheme(window.__baseTheme||VFResults.themeForVillage(''));this.textContent='◐ Greyscale'}
    else{root.dataset.grey='1';applyTheme(VFResults.THEMES.grey);this.textContent='● Colour'}
    if(window.__lastRender)window.__lastRender();
  });

  async function init(){
    const params=new URLSearchParams(location.search);
    const slug=params.get('slug')||'';
    const project=params.get('project')||'';
    if(!slug){
      const village=params.get('village')||'Smiths Lake';
      if(project)renderProject(project,village);else renderHub(village);
      return;
    }
    $('survey-link').href='/survey/?slug='+encodeURIComponent(slug);
    document.getElementById('main').innerHTML='<div class="vf-state"><div class="vf-spinner"></div><p>Loading results…</p></div>';
    try{
      const completed=params.get('completed')==='1'?'&completed=1':'';
      const [configRes,resultsRes]=await Promise.all([
        fetch(`${API}/survey-config?slug=${encodeURIComponent(slug)}`),
        fetch(`${API}/survey-results?slug=${encodeURIComponent(slug)}${completed}`)
      ]);
      const configData=await configRes.json();
      const resultsData=await resultsRes.json();
      if(configData.status==='not-found'){showState('⚠️','Survey not found.',true);return}
      if(resultsData.restricted){showState('📅',resultsData.message||'Results for this survey are not publicly available.',true);return}
      const visibility=(configData.survey&&configData.survey.resultsVisibility)||'public';
      if(visibility==='committee-only'){showState('⚠️','Results for this survey are available to committee members only.',true);return}
      if(visibility==='after-close'&&configData.status!=='closed'){showState('📅','Results will be published once the survey closes.',true);return}
      const survey=resultsData.survey||configData.survey||{};
      window.__baseTheme=VFResults.themeForVillage(survey.village);
      if(root.dataset.grey!=='1')applyTheme(window.__baseTheme);
      window.__lastRender=()=>renderSurvey(survey,resultsData,configData.status);
      window.__lastRender();
      buildSurveyNav(survey,slug);
    }catch(err){console.error(err);showState('⚠️','Could not load results. Please try again.',true)}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
