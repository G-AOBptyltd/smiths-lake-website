<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Results — VillageFirst</title>
  <meta name="robots" content="noindex">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root{
      --primary:#0f4c3a;--primary-2:#15795f;--accent:#0f8f80;
      --grad:linear-gradient(135deg,#0f4c3a 0%,#15795f 60%,#0f8f80 100%);
      --ink:#16261f;--muted:#6b7c75;--line:#e3ece8;--bg:#eef4f1;--card:#fff;
      --tint1:#ecfdf5;--tint2:#eff6ff;--tint3:#fffbeb;--tint4:#f5f3ff;
      --kn1:#059669;--kn2:#2563eb;--kn3:#e08a1e;--kn4:#7c3aed;
      --pos:#0f8f80;--neg:#e11d63;
      --shadow:0 1px 2px rgba(16,40,30,.04),0 10px 28px rgba(16,40,30,.07);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}

    .vf-topnav{background:#0c2c22;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .vf-topnav a,.vf-topnav button.lnk{color:rgba(255,255,255,.8);text-decoration:none;font-size:12px;background:none;border:0;cursor:pointer;font:inherit;font-size:12px}
    .vf-topnav a:hover,.vf-topnav button.lnk:hover{color:#fff}
    .vf-topnav .sep{color:rgba(255,255,255,.3)}
    .vf-topnav .right{margin-left:auto;display:flex;gap:12px;align-items:center}

    .hero{background:var(--grad);color:#fff;padding:28px 0 24px;position:relative;overflow:hidden}
    .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%)}
    .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
    .hero .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.78;font-weight:700}
    .hero h1{font-size:25px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
    .hero .sub{opacity:.85;font-size:13px;margin-top:5px}
    .badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:30px;padding:5px 14px;font-size:12px;margin-top:13px}
    .live-dot{width:8px;height:8px;border-radius:50%;background:#bdf5d8;animation:pulse 1.8s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(189,245,216,.7)}70%{box-shadow:0 0 0 9px rgba(189,245,216,0)}100%{box-shadow:0 0 0 0 rgba(189,245,216,0)}}

    .tabs{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .tabs-inner{max-width:1040px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 12px}
    .tab{border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:13px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
    .tab:hover{color:var(--primary-2)}
    .tab.on{color:var(--primary);border-bottom-color:var(--accent)}

    main{max-width:1040px;margin:0 auto;padding:22px 20px 70px}
    .panel{display:none;animation:fade .35s ease}.panel.on{display:block}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px}
    .grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
    .ctitle{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--primary-2);margin-bottom:12px}

    .headline{background:var(--grad);color:#fff;border-radius:14px;padding:17px 20px;font-size:15.5px;font-weight:600;line-height:1.5;box-shadow:var(--shadow)}
    .headline b{font-weight:800}.headline .ht{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.82;font-weight:800;display:block;margin-bottom:6px}

    .kpi{border-radius:14px;padding:16px;border:1px solid var(--line)}
    .kpi .n{font-size:31px;font-weight:900;line-height:1;letter-spacing:-.02em}.kpi .l{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:600}
    .kpi.k1{background:var(--tint1)}.kpi.k1 .n{color:var(--kn1)}.kpi.k2{background:var(--tint2)}.kpi.k2 .n{color:var(--kn2)}
    .kpi.k3{background:var(--tint3)}.kpi.k3 .n{color:var(--kn3)}.kpi.k4{background:var(--tint4)}.kpi.k4 .n{color:var(--kn4)}

    .callout{border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6;border-left:5px solid var(--accent);background:var(--tint1);color:#22302b}
    .callout.blue{background:var(--tint2);border-color:var(--kn2)}.callout.amber{background:var(--tint3);border-color:var(--kn3)}
    .callout b{font-weight:800}
    .auto-tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:5px;padding:2px 7px;margin-right:4px}

    .bars{display:flex;flex-direction:column;gap:11px}
    .bar-row{display:grid;grid-template-columns:210px 1fr auto;align-items:center;gap:12px}
    .bar-lab{font-size:12.5px;font-weight:600}.bar-lab small{display:block;color:var(--muted);font-weight:500;font-size:11px}
    .track{height:26px;background:#f1f6f3;border-radius:7px;overflow:hidden}
    .fill{height:100%;border-radius:7px;display:flex;align-items:center;padding:0 10px;color:#fff;font-size:11.5px;font-weight:800;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
    .bar-n{font-size:11px;color:var(--muted);min-width:34px;text-align:right}
    .rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;margin-right:8px}

    .donut-wrap{display:flex;flex-direction:column;align-items:center}
    .canvas-box{position:relative;width:100%;max-width:300px;height:240px}

    .dist-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .dist h4{font-size:13px;font-weight:700}.dist .avg{font-size:11.5px;color:var(--muted);margin:2px 0 8px}

    .lik{display:flex;flex-direction:column;gap:14px}
    .lik-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px}.lik-top .agree{color:var(--pos);font-weight:800}
    .lik-bar{display:flex;height:24px;border-radius:7px;overflow:hidden;background:#f1f6f3}
    .lik-seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}
    .lik-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
    .lik-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

    .gauge-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center}
    .gauge-box{position:relative;width:240px;height:140px}
    .gauge-val{position:absolute;bottom:6px;left:0;right:0;text-align:center}
    .gauge-val .gv{font-size:38px;font-weight:900;line-height:1}.gauge-val .gl{font-size:11px;color:var(--muted);font-weight:600}

    .themechips{display:flex;flex-wrap:wrap;gap:8px}.tchip{border-radius:30px;padding:7px 14px;font-weight:700;color:#fff;font-size:13px}

    .cmt{background:#f8fbf9;border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px}
    .cmt .who{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
    .cmt .tx{font-size:13.5px;color:#27332e}

    .find{border-radius:12px;padding:15px 17px;margin-bottom:12px;border:1px solid var(--line);border-left:5px solid var(--accent);background:#fff}
    .find h4{font-size:14px;font-weight:800;margin-bottom:5px}.find p{font-size:13px;color:#3b4a44}

    .vf-state{background:#fff;border-radius:14px;padding:46px 24px;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow)}
    .vf-state h2{font-size:18px;font-weight:700;margin-bottom:8px}.vf-state p{font-size:13px;color:var(--muted)}
    .vf-spinner{width:38px;height:38px;border:3px solid #e2e8f0;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .vf-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;border:none;border-radius:9px;padding:10px 22px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:14px}

    .mt{margin-top:14px}

    /* breadcrumb */
    .crumb{display:flex;align-items:center;gap:7px;font-size:11.5px;opacity:.9;margin-bottom:6px;flex-wrap:wrap}
    .crumb a{color:#fff;text-decoration:none;opacity:.85}.crumb a:hover{opacity:1;text-decoration:underline}
    .crumb .cs{opacity:.5}
    /* sub-nav bar */
    .subnav{background:#fff;border-bottom:1px solid var(--line)}
    .subnav-inner{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
    .subnav a.back{color:var(--primary-2);font-weight:700;font-size:13px;text-decoration:none}.subnav a.back:hover{text-decoration:underline}
    .subnav .right{margin-left:auto;display:flex;align-items:center;gap:8px}
    .subnav select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:260px;background:#fff;color:var(--ink)}
    .navbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;font-weight:600;color:var(--primary-2);cursor:pointer}
    .navbtn:hover:not(:disabled){background:var(--tint1)}.navbtn:disabled{opacity:.35;cursor:default}
    /* hub */
    .hub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .scard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
    .scard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(16,40,30,.12)}
    .scard .top{display:flex;align-items:flex-start;gap:10px}
    .scard .ico{font-size:20px}.scard .nm{font-weight:800;font-size:14.5px;flex:1;line-height:1.3}
    .scard .tpl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-top:2px}
    .pill{font-size:10px;font-weight:800;border-radius:30px;padding:3px 9px;white-space:nowrap}
    .pill.live{background:#dcfce7;color:#166534}.pill.paused{background:#fef3c7;color:#92500e}.pill.closed,.pill.scheduled{background:#e5e7eb;color:#4b5563}.pill.draft{background:#e0e7ff;color:#3730a3}
    .scard .meta{display:flex;gap:14px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;margin-top:auto}
    .scard .meta b{color:var(--ink)}.scard .view{margin-left:auto;color:var(--accent);font-weight:800}
    @media(max-width:760px){.hub-grid{grid-template-columns:1fr}}
    @media(max-width:760px){.g2,.g3,.g4,.dist-grid{grid-template-columns:1fr}.bar-row{grid-template-columns:120px 1fr auto}.bar-lab{font-size:11px}}
    @media print{.vf-topnav,.tabs,.no-print{display:none!important}.panel{display:block!important}body{background:#fff}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style>
</head>
<body>

<nav class="vf-topnav">
  <a href="/projects/">← Back to Project Hub</a>
  <span class="sep">·</span>
  <a id="navAllResults" href="/results/">📊 All Results</a>
  <span class="sep">·</span>
  <a id="survey-link" href="/survey/">Complete Survey</a>
  <span class="sep">·</span>
  <a href="/">VillageFirst Website</a>
  <div class="right">
    <button class="lnk" id="greyToggle">◐ Greyscale</button>
    <span class="sep">·</span>
    <button class="lnk" onclick="window.print();return false;">🖨 Print / Save PDF</button>
  </div>
</nav>

<header class="hero"><div class="wrap">
  <div class="crumb" id="hCrumb" style="display:none"></div>
  <div class="eyebrow" id="hEye">VillageFirst Community Survey</div>
  <h1 id="hTitle">Loading…</h1>
  <div class="sub" id="hSub"></div>
  <span class="badge" id="hBadgeWrap" style="display:none"><span class="live-dot" id="hDot"></span><span id="hBadge"></span></span>
</div></header>

<div class="subnav" id="subnav" style="display:none"><div class="wrap subnav-inner">
  <a class="back" id="allResults" href="#">← All results</a>
  <div class="right">
    <button class="navbtn" id="prevSurvey" title="Previous survey">‹</button>
    <select id="surveySwitch" aria-label="Jump to another survey"></select>
    <button class="navbtn" id="nextSurvey" title="Next survey">›</button>
  </div>
</div></div>

<div class="tabs" id="tabsWrap" style="display:none"><div class="tabs-inner" id="tabBar"></div></div>
<main id="main"><div id="state"></div></main>

<script>
(function(){
  const API_BASE='/api';

  /* ============ THEMES ============ */
  const THEMES={
    default:{primary:'#0f4c3a',p2:'#15795f',accent:'#0f8f80',grad:'linear-gradient(135deg,#0f4c3a 0%,#15795f 60%,#0f8f80 100%)',tint:['#ecfdf5','#eff6ff','#fffbeb','#f5f3ff'],kn:['#059669','#2563eb','#e08a1e','#7c3aed'],pie:['#0f8f80','#2563eb','#5c8a1b','#e08a1e','#7c3aed','#e11d63','#64748b'],ramp:['#0f4c3a','#15795f','#0f8f80','#2db597','#34d399','#86efac','#bbf7d0'],dist:['#e11d63','#e08a1e','#cbd5e1','#2db597','#0f8f80']},
    grey:{primary:'#111827',p2:'#374151',accent:'#4b5563',grad:'linear-gradient(135deg,#0b0f17 0%,#1f2937 55%,#374151 100%)',tint:['#f3f4f6','#f3f4f6','#f3f4f6','#f3f4f6'],kn:['#111827','#374151','#4b5563','#6b7280'],pie:['#111827','#374151','#4b5563','#6b7280','#9ca3af','#cbd5e1','#e5e7eb'],ramp:['#0b0f17','#1f2937','#374151','#4b5563','#6b7280','#9ca3af','#cbd5e1'],dist:['#111827','#4b5563','#9ca3af','#6b7280','#374151']}
  };
  const VILLAGE_THEMES={
    'smiths lake':{primary:'#0b6b6b',p2:'#0e8a8a',accent:'#14b8a6',grad:'linear-gradient(135deg,#063f3f 0%,#0b6b6b 55%,#14b8a6 100%)',tint:['#ecfeff','#eff6ff','#f0fdf4','#fffbeb'],kn:['#0d9488','#2563eb','#16a34a','#d97706'],pie:['#0b6b6b','#14b8a6','#2563eb','#16a34a','#d97706','#7c3aed','#64748b'],ramp:['#063f3f','#0b6b6b','#0e8a8a','#14b8a6','#5eead4','#99f6e4','#cffafe'],dist:['#dc2626','#d97706','#cbd5e1','#2dd4bf','#0d9488']},
    'blueys beach':{primary:'#0c4a8a',p2:'#1769aa',accent:'#2596d4',grad:'linear-gradient(135deg,#0c3a6e 0%,#1769aa 55%,#2596d4 100%)',tint:['#eff6ff','#fffbeb','#ecfeff','#fef2f2'],kn:['#1769aa','#d97706','#0891b2','#e11d63'],pie:['#1769aa','#2596d4','#e0a04e','#0891b2','#16a34a','#7c3aed','#64748b'],ramp:['#0c3a6e','#0c4a8a','#1769aa','#2596d4','#7cc4ec','#bfe1f6','#e3f2fc'],dist:['#dc2626','#e0a04e','#cbd5e1','#5cb3e0','#1769aa']},
    'coomba park':{primary:'#2f6d3b',p2:'#3f8a4e',accent:'#5fae5f',grad:'linear-gradient(135deg,#1f4a28 0%,#2f6d3b 55%,#5fae5f 100%)',tint:['#f0fdf4','#eff6ff','#fffbeb','#f5f3ff'],kn:['#3f8a4e','#2563eb','#d97706','#7c3aed'],pie:['#2f6d3b','#5fae5f','#2563eb','#d97706','#0891b2','#7c3aed','#64748b'],ramp:['#1f4a28','#2f6d3b','#3f8a4e','#5fae5f','#9ed99e','#c9efc9','#e6f8e6'],dist:['#dc2626','#d97706','#cbd5e1','#86c186','#3f8a4e']}
  };
  let TH=THEMES.default, baseTheme=THEMES.default;
  function setTheme(t){TH=t;const r=document.documentElement.style;r.setProperty('--primary',t.primary);r.setProperty('--primary-2',t.p2);r.setProperty('--accent',t.accent);r.setProperty('--grad',t.grad);t.tint.forEach((c,i)=>r.setProperty('--tint'+(i+1),c));t.kn.forEach((c,i)=>r.setProperty('--kn'+(i+1),c));r.setProperty('--pos',t.dist[4]);r.setProperty('--neg',t.dist[0])}
  function themeForVillage(v){return VILLAGE_THEMES[(v||'').trim().toLowerCase()]||THEMES.default}

  /* ============ HELPERS ============ */
  let charts=[];const clearCharts=()=>{charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]};
  const hasChart=typeof Chart!=='undefined';
  const pct=(v,t)=>t?Math.round(v/t*100):0;
  const num=v=>(v==null||isNaN(v))?0:v;
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
  const ramp=i=>TH.ramp[Math.min(i,6)];
  function topOf(o){const e=Object.entries(o||{}).sort((a,b)=>b[1]-a[1]);if(!e.length)return null;const t=e.reduce((s,[,v])=>s+v,0);return{label:e[0][0],n:e[0][1],pct:pct(e[0][1],t),total:t,entries:e}}
  function countUp(node,to,suffix){if(!isFinite(to)){node.textContent=to+(suffix||'');return}let s=0,steps=26,i=0;const inc=to/steps;const id=setInterval(()=>{i++;s+=inc;if(i>=steps){s=to;clearInterval(id)}node.textContent=(Number.isInteger(to)?Math.round(s):s.toFixed(1))+(suffix||'')},18)}

  function kpiRow(items){const g=el('div','grid g4');items.forEach((it,i)=>{const k=el('div','kpi k'+((i%4)+1),`<div class="n">0</div><div class="l">${esc(it.l)}</div>`);g.appendChild(k);setTimeout(()=>{if(typeof it.n==='number')countUp(k.querySelector('.n'),it.n,it.suf||'');else k.querySelector('.n').textContent=it.n},30)});return g}
  function rankedBars(rows,opts){opts=opts||{};const box=el('div','bars');rows.forEach((r,i)=>{const w=Math.max(num(r.val),2.5);const row=el('div','bar-row');row.innerHTML=`<div class="bar-lab">${opts.rankNum?`<span class="rank">${i+1}</span>`:''}${esc(r.label)}${r.sub?`<small>${esc(r.sub)}</small>`:''}</div><div class="track"><div class="fill" style="background:${ramp(i)}">${esc(r.txt)}</div></div><div class="bar-n">${r.n!=null?'n='+r.n:''}</div>`;box.appendChild(row);requestAnimationFrame(()=>setTimeout(()=>{const f=row.querySelector('.fill');if(f)f.style.width=Math.min(w,100)+'%'},60+i*70))});return box}
  function donut(obj,title){const wrap=el('div','donut-wrap');if(title)wrap.appendChild(el('div','ctitle',title));const cb=el('div','canvas-box');const cv=document.createElement('canvas');cb.appendChild(cv);wrap.appendChild(cb);if(hasChart)setTimeout(()=>charts.push(new Chart(cv,{type:'doughnut',data:{labels:Object.keys(obj),datasets:[{data:Object.values(obj),backgroundColor:TH.pie,borderColor:'#fff',borderWidth:2}]},options:{cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:11},padding:9}}}}})),20);return wrap}
  function donutCard(title,obj){const c=el('div','card');c.appendChild(donut(obj,title));return c}
  function distMini(items){const grid=el('div','dist-grid');items.forEach(it=>{const c=el('div','dist');c.innerHTML=`<h4>${esc(it.label)}</h4><div class="avg">avg ${num(it.avg).toFixed(2)} / 5 · n=${it.n||''}</div>`;const cb=el('div');cb.style.height='130px';const cv=document.createElement('canvas');cb.appendChild(cv);c.appendChild(cb);grid.appendChild(c);if(hasChart)setTimeout(()=>charts.push(new Chart(cv,{type:'bar',data:{labels:['1','2','3','4','5'],datasets:[{data:it.dist,backgroundColor:TH.dist,borderRadius:5}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0,font:{size:10}}},x:{ticks:{font:{size:10}}}}}})),20)});return grid}
  function gauge(value,label,min,max){const wrap=el('div','gauge-wrap');const box=el('div','gauge-box');const cv=document.createElement('canvas');box.appendChild(cv);const v=el('div','gauge-val',`<div class="gv" style="color:${TH.accent}">${value}</div><div class="gl">${esc(label)}</div>`);box.appendChild(v);wrap.appendChild(box);const frac=Math.max(0,Math.min(1,(value-min)/(max-min)));if(hasChart)setTimeout(()=>charts.push(new Chart(cv,{type:'doughnut',data:{datasets:[{data:[frac,1-frac],backgroundColor:[TH.accent,'#eef2f0'],borderWidth:0}]},options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false},tooltip:{enabled:false}}}})),20);return wrap}
  function divergingLikert(items){const box=el('div','lik');const cols=TH.dist;items.forEach(s=>{const t=s.dist.reduce((a,b)=>a+b,0);const p=s.dist.map(d=>pct(d,t));const agree=p[3]+p[4];const row=el('div');row.innerHTML=`<div class="lik-top"><span>${esc(s.label)}</span><span class="agree">${agree}% agree</span></div>`;const bar=el('div','lik-bar');p.forEach((pp,i)=>{if(pp>0){const seg=el('div','lik-seg',pp>=8?pp+'%':'');seg.style.width=pp+'%';seg.style.background=cols[i];bar.appendChild(seg)}});row.appendChild(bar);box.appendChild(row)});const lg=el('div','lik-legend');['Strongly disagree','Disagree','Neutral','Agree','Strongly agree'].forEach((t,i)=>lg.appendChild(el('span',null,`<i style="background:${cols[i]}"></i>${t}`)));box.appendChild(lg);return box}
  function quadrant(pts){const W=460,H=380,pad=46,pw=W-pad*2,ph=H-pad*2;const x=v=>pad+((v-1)/4)*pw,y=v=>pad+((5-v)/4)*ph;const mx=x(3),my=y(3);let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:520px;height:auto;font-family:inherit"><rect x="${pad}" y="${pad}" width="${pw/2}" height="${ph/2}" fill="#fef2f2"/><rect x="${mx}" y="${pad}" width="${pw/2}" height="${ph/2}" fill="${TH.tint[0]}"/><rect x="${pad}" y="${my}" width="${pw/2}" height="${ph/2}" fill="#f8fafc"/><rect x="${mx}" y="${my}" width="${pw/2}" height="${ph/2}" fill="#f8fafc"/><line x1="${mx}" y1="${pad}" x2="${mx}" y2="${pad+ph}" stroke="#cbd5e1" stroke-dasharray="4"/><line x1="${pad}" y1="${my}" x2="${pad+pw}" y2="${my}" stroke="#cbd5e1" stroke-dasharray="4"/><text x="${pad+8}" y="${pad+16}" font-size="11" font-weight="700" fill="#dc2626">Focus here</text><text x="${mx+8}" y="${pad+16}" font-size="11" font-weight="700" fill="${TH.accent}">Keep it up</text><text x="${pad+8}" y="${pad+ph-8}" font-size="11" fill="#9ca3af">Lower priority</text><text x="${mx+8}" y="${pad+ph-8}" font-size="11" fill="#9ca3af">Possible overkill</text><text x="${pad+pw/2}" y="${H-10}" font-size="11" fill="#475569" text-anchor="middle">Performance →</text><text x="14" y="${pad+ph/2}" font-size="11" fill="#475569" text-anchor="middle" transform="rotate(-90 14 ${pad+ph/2})">Importance →</text>`;pts.forEach((p,i)=>{const cx=x(num(p.performance)||1),cy=y(num(p.importance)||1);svg+=`<circle cx="${cx}" cy="${cy}" r="7" fill="${ramp(i)}" opacity=".9"/><text x="${cx+10}" y="${cy+4}" font-size="10" fill="#16261f">${esc(p.label)}</text>`});return el('div','card',svg)}
  function stacked100(items){const t=items.reduce((s,i)=>s+i.val,0)||1;const bar=el('div');bar.style.cssText='display:flex;height:34px;border-radius:9px;overflow:hidden;box-shadow:var(--shadow)';items.forEach((it,i)=>{const seg=el('div',null,pct(it.val,t)>=7?pct(it.val,t)+'%':'');seg.style.cssText=`width:${pct(it.val,t)}%;background:${ramp(i)};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800`;bar.appendChild(seg)});const lg=el('div');lg.style.cssText='display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px';items.forEach((it,i)=>lg.appendChild(el('span',null,`<i style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${ramp(i)};margin-right:6px;vertical-align:-1px"></i>${esc(it.label)} — <b>${it.val}</b>`)));const box=el('div');box.appendChild(bar);box.appendChild(lg);return box}
  function commentList(list){const c=el('div');list.slice(0,200).forEach(o=>{const main=o.comments||o.text||'';const extra=o.additionalComments?`<div class="tx" style="margin-top:6px">${esc(o.additionalComments)}</div>`:'';c.appendChild(el('div','cmt',`<div class="who">${esc(o.person||'Community member')}</div><div class="tx">${esc(main)}</div>${extra}`))});return c}
  function responsesPanel(list){const p=el('div');p.appendChild(el('div','callout','Comments are shown as submitted, lightly moderated for readability. Names and identifying details are removed.'));const c=el('div','card mt');c.appendChild(el('div','ctitle',`Open responses (${list.length})`));c.appendChild(commentList(list));p.appendChild(c);return p}
  function whoDonut(rb){return donutCard('Who responded?',rb)}
  function headline(text){return el('div','headline',`<span class="ht">Headline</span>${text}`)}

  // ratings may be {avg} (1-5) or {bestPct} (% share). Normalise to a bar value/text.

  /* ============ LAYOUTS (return {tabs:[{title,build}]}) ============ */
  function L_conjoint(d){

      p.appendChild(kpiRow([{n:d.count,l:'Total Responses'},{n:Object.keys(d.respondentBreakdown||{}).length,l:'Respondent Groups'},{n:ov?ov.pct:0,l:ov?'Leading: '+ov.label:'Leading',suf:'%'},{n:(d.openText||[]).length,l:'Written Comments'}]));
      const g=el('div','grid g2 mt');if(d.respondentBreakdown)g.appendChild(whoDonut(d.respondentBreakdown));if(ov)g.appendChild(donutCard('Overall preference',d.overall));p.appendChild(g);

    if(d.partB&&d.partB.length)tabs.push({title:'Key Differences',build:()=>{const p=el('div');p.appendChild(el('div','callout blue','<b>Importance of the key differences</b> rated 1–5.'));const c=el('div','card mt');c.appendChild(el('div','ctitle','Importance'));if(hasDist(d.partB)){c.appendChild(distMini(d.partB.map(b=>({label:b.label,avg:b.avg,n:b.n,dist:b.dist}))))}else{c.appendChild(rankedBars(d.partB.map(b=>({label:b.label,val:pct(b.avg,5),txt:num(b.avg).toFixed(2),n:b.n})),{rankNum:true}))}p.appendChild(c);return p}});
    if(d.conjoint&&d.conjoint.length)tabs.push({title:'Conjoint',build:()=>{const p=el('div');p.appendChild(el('div','callout amber','<b>Conjoint tasks</b> — package choices that isolate what drives preference.'));const cg=el('div','grid g2 mt');d.conjoint.forEach(t=>{const c=el('div','card');c.innerHTML=`<div class="ctitle" style="color:var(--ink)">${esc(t.task)}</div>`;c.appendChild(rankedBars([{label:t.option1,val:t.option1Pct,txt:t.option1Pct+'%',n:t.option1Count},{label:t.option2,val:t.option2Pct,txt:t.option2Pct+'%',n:t.option2Count}]));cg.appendChild(c)});p.appendChild(cg);return p}});
    if(d.partD&&d.partD.length)tabs.push({title:'Priorities',build:()=>{const p=el('div');p.appendChild(el('div','callout','<b>Relative importance</b> — average of 100 points across the differences.'));const obj={};d.partD.forEach(x=>obj[x.label]=x.avg);const g=el('div','grid g2 mt');g.appendChild(donutCard('Average allocation',obj));const c=el('div','card');c.appendChild(el('div','ctitle','Allocation breakdown'));c.appendChild(rankedBars(d.partD.map(x=>({label:x.label,val:x.avg,txt:x.avg+'%'}))));g.appendChild(c);p.appendChild(g);return p}});

    tabs.push({title:'Analysis',build:()=>{const f=[];if(ov)f.push(['Leading preference',`${ov.label} leads at ${ov.pct}% of ${d.count} responses.`]);if(d.partA&&d.partA.length){const s=[...d.partA].sort((a,b)=>b.avg-a.avg);f.push(['Highest-rated shared feature',`${s[0].label} scored ${num(s[0].avg).toFixed(2)}/5.`])}if(d.partD&&d.partD.length){const s=[...d.partD].sort((a,b)=>b.avg-a.avg);f.push(['Top priority',`${s[0].label} attracts the most points (${s[0].avg}).`])}return findingsList(f)}});

  function L_maxdiff(d){const top=(d.utilityScores||[])[0];const tabs=[];

  /* ============ MOUNT ============ */
  function mountTabs(tabs){
    const tabsWrap=document.getElementById('tabsWrap');const tabBar=document.getElementById('tabBar');const main=document.getElementById('main');
    tabBar.innerHTML='';main.innerHTML='';
    if(tabs.length>1){tabsWrap.style.display='';}else{tabsWrap.style.display='none';}
    tabs.forEach((t,i)=>{
      const b=el('button','tab'+(i===0?' on':''),esc(t.title));
      const pan=el('div','panel'+(i===0?' on':''));pan.appendChild(t.build());main.appendChild(pan);
      b.onclick=()=>{[...tabBar.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');[...main.children].forEach(x=>x.classList.remove('on'));main.children[i].classList.add('on');window.scrollTo({top:0,behavior:'smooth'})};
      tabBar.appendChild(b);
    });
  }
  function renderResults(survey,data,status){
    const isLive=status==='active';
    const count=data.count||0;
    const snapDate=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
    document.getElementById('hEye').textContent=(survey&&survey.village?survey.village+' · ':'')+'VillageFirst Community Survey';
    document.getElementById('hTitle').textContent=(survey&&survey.surveyName)||'Community Survey Results';
    document.getElementById('hSub').textContent=(survey&&survey.snapshotLabel)||'';
    const bw=document.getElementById('hBadgeWrap');bw.style.display='';
    document.getElementById('hDot').style.display=isLive?'':'none';
    document.getElementById('hBadge').innerHTML=`${isLive?'Live':'📸 Snapshot'} · ${snapDate} · n = ${count} responses${isLive?' · still open':''}`;
    if(count===0){document.getElementById('tabsWrap').style.display='none';document.getElementById('main').innerHTML='<div class="vf-state"><h2>No responses yet</h2><p>Results will appear here as the community responds.</p></div>';return}
    const tpl=data.template||(survey&&survey.template);
    const layout=LAYOUTS[tpl];
    if(!layout){document.getElementById('main').innerHTML='<div class="vf-state"><h2>Results received</h2><p>'+count+' responses recorded.</p></div>';return}
    mountTabs(layout(data));
  }

  function state(html){document.getElementById('tabsWrap').style.display='none';document.getElementById('main').innerHTML='<div id="state">'+html+'</div>'}
  function loading(){state('<div class="vf-state"><div class="vf-spinner"></div><p>Loading results…</p></div>')}
  function errState(msg){document.getElementById('hTitle').textContent='Survey Results';state('<div class="vf-state"><h2>⚠️ '+esc(msg)+'</h2><a href="/" class="vf-btn">Return to website</a></div>')}
  function infoState(msg){document.getElementById('hTitle').textContent='Survey Results';state('<div class="vf-state"><h2>📅 '+esc(msg)+'</h2><a href="/" class="vf-btn">Return to website</a></div>')}

  // Greyscale / print toggle
  document.getElementById('greyToggle').addEventListener('click',function(){
    if(document.documentElement.dataset.grey==='1'){document.documentElement.dataset.grey='';setTheme(baseTheme);this.textContent='◐ Greyscale'}
    else{document.documentElement.dataset.grey='1';setTheme(THEMES.grey);this.textContent='● Colour'}
    if(window.__lastRender)window.__lastRender();
  });

  /* ===== navigation: hub, switcher, prev/next, breadcrumb ===== */
  const TPL_ICON={'conjoint-design-options':'⚖️','priority-ranking':'🎯','annual-satisfaction':'📊','star-rating':'⭐','quick-poll':'✅','likert-agreement':'📋','open-feedback':'💬','ranked-choice':'🔢','budget-allocation':'💰','importance-performance':'📈','demographic':'👥','respondent-profile':'👥','multi-section':'🗂️'};
  function effStatus(s){const st=(s.status||'').toLowerCase();if(st==='draft')return'draft';if(st==='paused')return'paused';if(st==='closed')return'closed';if(st==='scheduled')return'scheduled';const now=new Date();const open=st==='live'?true:!!s.active;if(!open)return'closed';if(s.openDate&&new Date(s.openDate)>now)return'scheduled';if(s.closeDate&&new Date(s.closeDate)<now)return'closed';return'live'}
  function publicViewable(s){const vis=(s.resultsVisibility||'public').toLowerCase();const st=effStatus(s);if(st==='draft')return false;if(vis==='public')return true;if(vis==='after-close')return st==='closed';return false}
  async function fetchVillageSurveys(village){try{const r=await fetch(`${API_BASE}/survey-list?village=${encodeURIComponent(village||'Smiths Lake')}`);const d=await r.json();return (d.surveys||[]).filter(s=>s.slug)}catch(e){return[]}}

  function buildSurveyNav(survey,slug){
    const village=survey.village||'Smiths Lake';
    const cr=document.getElementById('hCrumb');
    let html=`<a href="/results/?village=${encodeURIComponent(village)}">${esc(village)}</a><span class="cs">›</span>`;
    if(survey.projectName)html+=`<a href="/projects/">${esc(survey.projectName)}</a><span class="cs">›</span>`;
    html+=`<span>${esc(survey.surveyName||'Survey')}</span>`;
    cr.innerHTML=html;cr.style.display='';
    const sub=document.getElementById('subnav');sub.style.display='';
    document.getElementById('allResults').href=`/results/?village=${encodeURIComponent(village)}`;
    document.getElementById('navAllResults').href=`/results/?village=${encodeURIComponent(village)}`;
    fetchVillageSurveys(village).then(list=>{
      const items=list.filter(publicViewable);
      const sel=document.getElementById('surveySwitch');sel.innerHTML='';
      items.forEach(s=>{const o=document.createElement('option');o.value=s.slug;o.textContent=s.surveyName;if(s.slug===slug)o.selected=true;sel.appendChild(o)});
      if(!items.some(s=>s.slug===slug)){const o=document.createElement('option');o.value=slug;o.textContent=survey.surveyName||slug;o.selected=true;sel.insertBefore(o,sel.firstChild)}
      sel.onchange=()=>{location.href=`/results/?slug=${encodeURIComponent(sel.value)}`};
      const idx=items.findIndex(s=>s.slug===slug);
      const prev=document.getElementById('prevSurvey'),next=document.getElementById('nextSurvey');
      const pv=idx>0?items[idx-1]:null,nx=(idx>-1&&idx<items.length-1)?items[idx+1]:null;
      prev.disabled=!pv;next.disabled=!nx;
      if(pv)prev.onclick=()=>location.href=`/results/?slug=${encodeURIComponent(pv.slug)}`;
      if(nx)next.onclick=()=>location.href=`/results/?slug=${encodeURIComponent(nx.slug)}`;
    });
  }

  async function renderHub(village){
    document.getElementById('survey-link').href='/survey/';
    document.getElementById('navAllResults').href=`/results/?village=${encodeURIComponent(village)}`;
    document.getElementById('hEye').textContent=village+' · VillageFirst Community Surveys';
    document.getElementById('hTitle').textContent='Community Survey Results';
    document.getElementById('hSub').textContent='Browse results from across the village';
    baseTheme=themeForVillage(village);if(document.documentElement.dataset.grey!=='1')setTheme(baseTheme);
    document.getElementById('tabsWrap').style.display='none';
    const main=document.getElementById('main');main.innerHTML='<div class="vf-state"><div class="vf-spinner"></div><p>Loading surveys…</p></div>';
    const list=(await fetchVillageSurveys(village)).filter(publicViewable);
    if(!list.length){main.innerHTML='<div class="vf-state"><h2>No public results yet</h2><p>Survey results will appear here once published.</p></div>';return}
    const grid=el('div','hub-grid');
    list.forEach(s=>{
      const st=effStatus(s);const a=el('a','scard');a.href=`/results/?slug=${encodeURIComponent(s.slug)}`;
      const cnt=s.responseCount!=null?s.responseCount:'—';
      const close=s.closeDate?('closes '+new Date(s.closeDate).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})):'';
      a.innerHTML=`<div class="top"><span class="ico">${TPL_ICON[s.template]||'📋'}</span><div style="flex:1"><div class="nm">${esc(s.surveyName)}</div><div class="tpl">${esc((s.template||'').replace(/-/g,' '))}</div></div><span class="pill ${st}">${st[0].toUpperCase()+st.slice(1)}</span></div><div class="meta"><span><b>${cnt}</b> responses</span>${close?`<span>${esc(close)}</span>`:''}<span class="view">View results →</span></div>`;
      grid.appendChild(a);
    });
    main.innerHTML='';main.appendChild(grid);
  }

  async function init(){
    const params=new URLSearchParams(window.location.search);
    const slug=params.get('slug')||'';
    if(!slug){renderHub(params.get('village')||'Smiths Lake');return}
    document.getElementById('survey-link').href='/survey/?slug='+encodeURIComponent(slug);
    loading();
    try{
      const completed=params.get('completed')==='1'?'&completed=1':'';
      const [configRes,resultsRes]=await Promise.all([
        fetch(`${API_BASE}/survey-config?slug=${encodeURIComponent(slug)}`),
        fetch(`${API_BASE}/survey-results?slug=${encodeURIComponent(slug)}${completed}`)
      ]);
      const configData=await configRes.json();
      const resultsData=await resultsRes.json();
      if(configData.status==='not-found'){errState('Survey not found.');return}
      if(resultsData.restricted){infoState(resultsData.message||'Results for this survey are not publicly available.');return}
      const visibility=(configData.survey&&configData.survey.resultsVisibility)||'public';
      if(visibility==='committee-only'){errState('Results for this survey are available to committee members only.');return}
      if(visibility==='after-close'&&configData.status!=='closed'){infoState('Results will be published once the survey closes.');return}
      const survey=resultsData.survey||configData.survey||{};
      baseTheme=themeForVillage(survey.village);
      if(document.documentElement.dataset.grey!=='1')setTheme(baseTheme);
      window.__lastRender=()=>{clearCharts();renderResults(survey,resultsData,configData.status)};
      window.__lastRender();
      buildSurveyNav(survey,slug);
    }catch(err){console.error(err);errState('Could not load results. Please try again.');}
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

</html>
