<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Survey — VillageFirst</title>
  <meta name="robots" content="noindex">
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f0;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Site nav ── */
    .vf-topnav {
      background: #0f4c3a;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .vf-topnav a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 12px;
    }
    .vf-topnav a:hover { color: #fff; }
    .vf-topnav-sep { color: rgba(255,255,255,0.3); }

    /* ── Container ── */
    .vf-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    /* ── Survey shell ── */
    #survey-root { min-height: 400px; }

    /* ── State screens ── */
    .vf-state {
      background: #fff;
      border-radius: 10px;
      padding: 40px 24px;
      text-align: center;
      margin-top: 20px;
      border: 1px solid #e2e8f0;
    }
    .vf-state-icon { font-size: 40px; margin-bottom: 16px; }
    .vf-state h2 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    .vf-state p { font-size: 14px; color: #64748b; margin-bottom: 16px; line-height: 1.6; }
    .vf-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; }
    .vf-spinner {
      width: 36px; height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #059669;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Survey layout ── */
    .vf-survey { display: flex; flex-direction: column; gap: 0; }

    .vf-survey-header {
      background: #0f4c3a;
      color: #fff;
      padding: 16px 20px;
      border-radius: 10px 10px 0 0;
    }
    .vf-survey-title { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
    .vf-survey-meta { font-size: 11px; opacity: 0.7; }

    .vf-progress-bar { height: 4px; background: #e2e8f0; }
    .vf-progress-fill { height: 100%; background: #34d399; transition: width 0.4s; }

    .vf-part-label {
      background: #fff;
      padding: 10px 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #059669;
      border-bottom: 1px solid #f1f5f9;
    }

    .vf-part-content {
      background: #fff;
      padding: 20px;
    }

    .vf-nav {
      background: #fff;
      border-top: 1px solid #e2e8f0;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 0 0 10px 10px;
      gap: 10px;
    }

    /* ── Components ── */
    .vf-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .vf-btn:hover { background: #047857; }
    .vf-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .vf-btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
    }
    .vf-btn-secondary:hover { background: #e2e8f0; }

    .vf-intro-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
    }
    .vf-intro-card p { font-size: 13px; color: #374151; line-height: 1.6; }

    .vf-field { margin-top: 16px; }
    .vf-field-label { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 8px; }

    .vf-pills { display: flex; flex-wrap: wrap; gap: 7px; }
    .vf-pill {
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid #d1d5db;
      cursor: pointer;
      color: #374151;
      background: #fff;
      transition: all 0.15s;
    }
    .vf-pill:hover { border-color: #059669; }
    .vf-pill.selected { border-color: #059669; background: #f0fdf4; color: #166534; font-weight: 700; }

    .vf-part-desc { font-size: 13px; color: #64748b; line-height: 1.6; margin-bottom: 14px; }

    /* ── Ratings ── */
    .vf-rating-list { display: flex; flex-direction: column; gap: 10px; }
    .vf-rating-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 7px;
    }
    .vf-rating-label { flex: 1; font-size: 12px; color: #1e293b; line-height: 1.4; }
    .vf-rating-stars { display: flex; gap: 4px; flex-shrink: 0; }
    .vf-star {
      width: 34px; height: 34px;
      border-radius: 6px;
      border: 1.5px solid #d1d5db;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: #9ca3af;
      transition: all 0.15s;
    }
    .vf-star:hover { border-color: #059669; color: #059669; }
    .vf-star.selected { border-color: #059669; background: #059669; color: #fff; }

    /* ── Conjoint task ── */
    .vf-conjoint-task { margin-bottom: 20px; }
    .vf-conjoint-label { font-size: 12px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    .vf-conjoint-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .vf-choice-btn {
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .vf-choice-btn strong { font-size: 12px; color: #0f172a; }
    .vf-choice-btn:hover { border-color: #059669; }
    .vf-choice-btn.selected { border-color: #059669; background: #f0fdf4; }
    .vf-feature-tag { font-size: 10px; background: #f1f5f9; color: #475569; padding: 2px 7px; border-radius: 20px; display: inline-block; }

    /* ── Attribute table ── */
    .vf-attr-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; margin-bottom: 12px; }
    .vf-attr-table th { background: #0f4c3a; color: #fff; padding: 8px 10px; text-align: left; font-size: 11px; }
    .vf-attr-table td { padding: 7px 10px; border-bottom: 1px solid #f1f5f9; }
    .vf-attr-diff { font-weight: 600; color: #059669; }

    /* ── Priority allocation ── */
    .vf-allocation { display: flex; flex-direction: column; gap: 12px; }
    .vf-alloc-row { display: flex; align-items: center; gap: 10px; }
    .vf-alloc-label { font-size: 12px; color: #374151; width: 180px; flex-shrink: 0; }
    .vf-alloc-slider { flex: 1; accent-color: #059669; }
    .vf-alloc-val { font-size: 12px; font-weight: 700; color: #059669; width: 36px; text-align: right; }
    .vf-alloc-total { font-size: 12px; color: #64748b; text-align: right; margin-top: 4px; }

    /* ── MaxDiff ── */
    .vf-round-label { font-size: 11px; color: #9ca3af; text-align: right; padding: 8px 20px 4px; background: #fff; }
    .vf-maxdiff { padding: 0 20px 16px; background: #fff; }
    .vf-maxdiff-instruction { font-size: 13px; color: #374151; margin-bottom: 12px; line-height: 1.5; }
    .vf-best-color { color: #059669; }
    .vf-worst-color { color: #dc2626; }
    .vf-maxdiff-table { width: 100%; border-collapse: collapse; }
    .vf-maxdiff-table th { font-size: 10px; text-transform: uppercase; color: #9ca3af; padding: 6px 8px; text-align: center; }
    .vf-maxdiff-table td { padding: 8px 8px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .vf-item-label { font-size: 13px; color: #1e293b; }
    .vf-radio-cell { text-align: center; width: 80px; }
    .vf-radio {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      display: inline-block;
      cursor: pointer;
      transition: all 0.15s;
      vertical-align: middle;
    }
    .vf-radio-best.active { border-color: #059669; background: #059669; box-shadow: 0 0 0 3px #dcfce7; }
    .vf-radio-worst.active { border-color: #dc2626; background: #dc2626; box-shadow: 0 0 0 3px #fee2e2; }

    /* ── NPS ── */
    .vf-nps-scale { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
    .vf-nps-btn {
      width: 36px; height: 36px;
      border-radius: 6px;
      border: 1.5px solid #e2e8f0;
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .vf-nps-btn:hover { border-color: #059669; }
    .vf-nps-btn.selected { border-color: #059669; background: #059669; color: #fff; }
    .vf-nps-labels { display: flex; justify-content: space-between; font-size: 10px; color: #9ca3af; margin-top: 4px; }

    /* ── Textarea ── */
    .vf-textarea {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 7px;
      padding: 10px 12px;
      font-size: 13px;
      font-family: inherit;
      color: #1e293b;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }
    .vf-textarea:focus { border-color: #059669; }

    .vf-checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    .vf-checkbox-label input { accent-color: #059669; width: 16px; height: 16px; }

    /* ── Thank you / closed ── */
    .vf-thankyou .vf-state-icon, .vf-closed .vf-state-icon { font-size: 48px; }
    .vf-state .vf-btn { margin: 6px auto; display: block; max-width: 280px; }

    @media (max-width: 600px) {
      .vf-conjoint-choices { grid-template-columns: 1fr; }
      .vf-rating-row { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<nav class="vf-topnav">
  <a href="/projects/">← Back to Project Hub</a>
  <span class="vf-topnav-sep">·</span>
  <a href="/">VillageFirst Website</a>
</nav>

<div class="vf-container">
  <div id="survey-root"></div>
</div>

<script src="/js/survey-engine.js"></script>

</body>
</html>
