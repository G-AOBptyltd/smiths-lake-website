# Redirect old Blueys Beach project slug to current slug
[[redirects]]
  from = "/projects/bluey-s-beach-village-centre/"
  to = "/projects/bluey-s-beach-village-survey-concept-designs/"
  status = 301

# Legacy newsletter URL — the "Stay Connected" signup now lives on the
# membership page (free-updates section). The Netlify `newsletter` form itself
# still renders statically on /membership/ and the /news/ sidebar, so the
# Zapier → Mailchimp zap (keyed to the FORM NAME, not this URL) is unaffected.
[[redirects]]
  from = "/newsletter/"
  to = "/membership/#updates"
  status = 301

# Redirect old Lilly Pilly Glade news slug to current slug.
# The Notion title is "**Lilly Pilly Glade:** New seating and rest area now
# established on the foreshore". parseProperty() used to read only the first
# rich-text segment, so the title was truncated at the bold boundary to
# "Lilly Pilly Glade:" and the slug became /news/lilly-pilly-glade/. Fixing the
# truncation lengthens the slug, so this preserves the shared URL — same pattern
# as the Blueys Beach rename above (Session 14.5).
[[redirects]]
  from = "/news/lilly-pilly-glade/"
  to = "/news/lilly-pilly-glade-new-seating-and-rest-area-now-established-on-the-foreshore/"
  status = 301

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Survey engine — short cache so updates propagate quickly
[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Netlify Forms configuration is handled in HTML with data-netlify="true"
