[build]
  command = "npm run build"
  publish = "dist"

# Pin the Node version so Netlify can't silently move us to a newer build image.
# (An unpinned image upgrade to Node 22 is what first exposed the node-fetch v2
# gzip "Premature close" bug in @notionhq/client. We now use native fetch, but
# pinning keeps builds reproducible.)
[build.environment]
  NODE_VERSION = "22"

# Netlify Functions — Survey Platform
[functions]
  directory = "netlify/functions"
  # Force esbuild so shared modules (auth/villages helpers) are inlined into each
  # function bundle. Without this, Netlify can omit imported helper files and the
  # importing functions crash at load (blank 502).
  node_bundler = "esbuild"

# Redirect www to non-www
[[redirects]]
  from = "https://www.villagefirst.org.au/*"
  to = "https://villagefirst.org.au/:splat"
  status = 301
  force = true

